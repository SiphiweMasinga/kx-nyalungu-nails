# Both functions are called by the public website (kx-api) and by PayFast (payfast-itn),
# so they don't require a logged-in user. Each function does its own validation.
[functions.kx-api]
verify_jwt = false

[functions.payfast-itn]
verify_jwt = false

# Login emails (invite, password reset) send the owner to her dashboard.
# Public sign-ups are off: the only account is the owner, invited from Supabase.
[auth]
site_url = "https://siphiwemasinga.github.io/kx-nyalungu-nails/admin/"
additional_redirect_urls = ["https://siphiwemasinga.github.io/kx-nyalungu-nails/admin/"]
enable_signup = false
